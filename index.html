<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#03070b">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.webmanifest">
<title>PKE Field Scanner</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="app">
  <section id="activation" class="screen active">
    <div class="boot-mark">PKE-01</div>
    <div class="activation-title">P.K.E. FIELD SCANNER</div>
    <div class="subtitle">PSYCHOKINETIC ENERGY ANALYSER</div>
    <button id="activateBtn" class="primary">ACTIVATE</button>
    <div class="standby">SYSTEM STANDBY</div>
  </section>

  <section id="boot" class="screen">
    <div class="boot-log" id="bootLog"></div>
    <div class="progress"><span id="bootProgress"></span></div>
  </section>

  <section id="main" class="screen">
    <header><span>PKE-01</span><span id="modeLabel">FIELD SCAN</span></header>
    <div class="display-top">
      <div class="display-label">PSYCHOKINETIC FIELD</div>
      <canvas id="wave"></canvas>
    </div>
    <div class="controls">
      <div class="readout">
        <div class="small">THREAT LEVEL</div>
        <div id="threatValue">100</div>
        <div id="status" class="status">LOW</div>
      </div>
      <div class="meter"><div id="meterFill"></div></div>
      <div class="info-row"><span>SIGNAL</span><b id="signal">18%</b></div>
      <div class="info-row"><span>FIELD</span><b id="field">12%</b></div>
      <div class="buttons">
        <button id="thermalBtn">THERMAL</button>
        <button id="modeBtn">AUTO</button>
        <button id="lockBtn">LOCK</button>
      </div>
      <input id="threatSlider" type="range" min="100" max="1200" value="100" aria-label="Threat level">
      <div class="slider-labels"><span>100</span><span>1200</span></div>
      <button id="deactivateBtn" class="danger">DEACTIVATE</button>
    </div>
  </section>

  <section id="thermal" class="screen">
    <header><span>PKE-01</span><span>THERMAL IMAGING</span></header>
    <div class="thermal-view">
      <div class="thermal-grid"></div>
      <div class="reticle">⊙</div>
      <div class="fake-hotspot"></div>
      <div class="scanline"></div>
      <div class="thermal-placeholder">CAMERA PLACEHOLDER</div>
      <div class="thermal-note">LIVE CAMERA WILL APPEAR HERE</div>
    </div>
    <div class="controls">
      <div class="thermal-state">THERMAL FIELD: <b id="thermalState">ACTIVE</b></div>
      <div class="info-row"><span>ANOMALY</span><b id="thermalAnomaly">NONE</b></div>
      <div class="info-row"><span>THREAT</span><b id="thermalThreat">100</b></div>
      <button id="returnBtn">RETURN TO PKE</button>
      <button id="thermalDeactivateBtn" class="danger">DEACTIVATE</button>
    </div>
  </section>
</div>
<script src="app.js"></script>
</body>
</html>
